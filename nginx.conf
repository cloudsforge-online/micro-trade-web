# Forge Trade's server block.
#
# THE ONE THING TO UNDERSTAND HERE: an unknown path answers 404, not 200.
#
# The usual SPA fallback is `try_files $uri /index.html`, which serves the bundle with a 200 for
# every address in existence. That makes a "page not found" screen a success: search engines index
# it, uptime checks call it healthy, link checkers pass, and a deploy that drops a route looks
# exactly like a deploy that did not.
#
# On this surface the addresses that matter are `/backtests/<uuid>` — the status page a queued run
# is polled on, and the URL `POST /v1/backtests` returns in its `location` header (see the
# `/v1/backtests` handler in `trade/src/server.ts`) — and `/markets/<symbol>`, the trading terminal,
# which is the page a customer keeps open and hard-refreshes. A mistyped backtest id answering 200
# would show somebody an empty report and call it a working page; a mistyped symbol answering 200
# would show them an empty order book, which is indistinguishable from a market with no bids.
#
# So the client routes are ENUMERATED below, and everything else falls through to
# `error_page 404 /index.html`, which serves the same bundle while KEEPING the 404 status. React
# renders NotFoundPage inside it, and the status line tells the truth.
#
# The cost is that this list and `ROUTES` in src/lib/routes.ts must agree. That is one line per
# route, paid once per route, and `test/routes.test.ts` reads this file and fails the build when
# they drift. "Remember to update nginx.conf" is not a mechanism; a test is.

# ── IS THIS HOSTNAME AN ENVIRONMENT OTHER THAN MAINNET? ────────────────────────────────────────
#
# `map` is in http context, which is why it sits above the server block rather than inside it —
# a conf.d file is included in http, so this is legal here and would not be legal ten lines down.
#
# THE LABELS ARE `ENV_LABELS` FROM @cloudsforge/ui, and test/sitemap.test.ts reads that export and
# fails if this alternation has drifted from it. They are the words that name an environment rather
# than a surface: `surfaces.ts` reserves them so that no surface may take one as a subdomain, and
# `deploy/scripts/check-apex-prefix.py` enforces that.
#
# The environment is a SUFFIX on the first label now (`trade-testnet.`) and was an apex prefix
# (`testnet.`) before; both shapes still resolve, so the pattern catches both. A non-mainnet
# environment is not a thing to be indexed at all: it answers `Disallow: /` and serves no sitemap.
# A testnet estate carries test EMBER, a faucet and deliberately broken states, and every page of
# it competing with the real one in a search index is a support problem before it is an SEO one.
map $host $cf_env {
    default '';
    ~^(?:[^.]+-)?(?:testnet|staging|preview|dev|mainnet)\. 'yes';
}

server {
    # 8080 because the image is nginx-unprivileged: nothing in this container is root, and a
    # non-root process cannot bind 80.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing is real routing: the address must survive a hard refresh.
    absolute_redirect off;

    # ---- security headers ------------------------------------------------
    # SAMEORIGIN rather than DENY: this is a public product surface with legitimate same-origin
    # embeds inside Hub, unlike the operator console, which has none and uses DENY.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- assets ----------------------------------------------------------
    # Immutable, because every build emits new hashed filenames. A missing asset is a 404 on its
    # own terms and must NOT fall through to the app shell: a JavaScript request answered with
    # HTML fails with a syntax error that names the wrong file.
    location /trade/assets/ {
        try_files $uri =404;
        # REPEATED, NOT INHERITED. nginx's `add_header` is all-or-nothing per level: a location
        # that declares ANY add_header inherits NONE from its parent. So every location below that
        # sets Cache-Control must restate the security headers, or it silently serves without them
        # — which is exactly what `location /assets/` did in the template, stripping nosniff from
        # every hashed script in every frontend cut from it.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html is never cached. It is the file that names the current asset hashes, so a stale
    # copy pins a browser to a deploy that no longer exists.
    location = /trade/index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the client routes, enumerated -----------------------------------
    # Keep in step with ROUTES in src/lib/routes.ts. test/routes.test.ts reads both.
    # ── THE TRAILING SLASH IS AN ADDRESS THIS SURFACE DID NOT USED TO HAVE ────────────────
    #
    # While this bundle was a hostname its index was `/`, which has no slash-suffixed variant to
    # get wrong. The front door is a path now, so a reader who types the folder with a slash — or
    # any tool that normalises a directory-looking URL by adding one — arrives at a second address.
    #
    # Enumerated exactly, like everything else here, rather than by widening to `location /trade`:
    # a prefix would also claim `/trademark`, and would re-open the "every address answers 200"
    # hole this whole file exists to keep shut. Not a 301 either — the gateway routes both and the
    # canonical stays the bare form.
    location = /trade/ {
        try_files /trade/index.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    location = /trade {
        try_files /trade/index.html =404;
        # `try_files` is a FILE LOOKUP, not an internal redirect, so serving /index.html here does
        # NOT re-enter `location = /index.html` above — and this location therefore has to declare
        # the shell's no-store itself. Without it `/` shipped with no Cache-Control at all, which
        # is the one document that must never be cached: it names the hashed bundle.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/trade/(markets|orders|balances|backtests|bots)(/|$) {
        try_files /trade/index.html =404;
        # Same reason as `location = /` above: try_files does not re-enter, so restate them all.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the sitemap and robots.txt, composed from \$host -----------------
    #
    # They are here rather than in public/ because a sitemap must carry ABSOLUTE URLs — the spec
    # requires it and a crawler discards a relative `<loc>` — and nothing built in this repository
    # is allowed to name a hostname: one image is served from localhost, from a preview deployment
    # and from `trade.<apex>`. nginx is the component that knows, because it has \$host on every
    # request, so the addresses below are composed per request and the artefact stays
    # environment-free.
    #
    # THIS SURFACE IS NOT THE APEX, WHICH IS WHY THE SHARED `sitemapXml()` IS NOT USED HERE.
    #
    # That helper composes each sibling as `<subdomain>.<host>`, which is right on the marketing
    # site and wrong here: \$host is ALREADY `trade.<apex>`, so it would emit
    # `foresight.trade.cloudsforge.online` — a two-label name that no DNS record answers and that
    # Cloudflare's one-label wildcard certificate could not terminate anyway. The estate sitemap
    # belongs to the apex and is served from there. What belongs here is this surface's own public
    # routes, and there is exactly one of them: `/`, the strategy catalogue, which
    # `GET /v1/strategies` leaves unauthenticated on purpose. Every other route — /markets, /orders,
    # /balances, /backtests, /bots — is a ProtectedRoute, and the exchange ones are gated even
    # though a market list and a depth ladder are not private: `reader()` in `trade/src/server.ts`
    # authenticates before it reads anything, so an unsigned-in crawler could only ever be told 401.
    # Listing those would invite it to addresses that can answer it with a sign-in redirect and
    # nothing else.
    #
    # test/sitemap.test.ts regenerates robots.txt from @cloudsforge/ui/sitemap, checks every <loc>
    # is composed rather than typed, and reads this repository's own route table for the list — so
    # this block is generated output that happens to live in a config file.
    location = /trade/sitemap.xml {
        # `types { }` empties the mime table FOR THIS LOCATION so `default_type` is what applies.
        # Without it nginx maps the `.xml` in the URI to `text/xml` from its own table and the
        # `default_type` line is inert — a declaration that reads as a decision and is not one.
        types { }
        default_type application/xml;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=3600" always;
        # An environment that must not be indexed has no sitemap. `return` inside `if` is one of
        # the two uses of `if` in a location that are defined behaviour rather than a trap.
        if ($cf_env) { return 404; }
        # ── THE SCHEME IS A LITERAL `https`, AND `$scheme` WAS A LIVE DEFECT ──────────────────────
        #
        # TLS ends at Cloudflare, cloudflared speaks plain HTTP to the gateway and the gateway
        # speaks plain HTTP to this container, so `$scheme` is `http` for a reader who arrived over
        # `https` — and every `<loc>` advertised an address that 301s. Found and fixed in micro-site
        # in wave 1, exchange-web in wave 2 and market-web in wave 3a; this is the fourth copy.
        #
        # `$host` STAYS a variable: the host genuinely differs per request and still must.
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url><loc>https://$host/trade</loc></url>
</urlset>';
    }

    # ---- THERE WAS A `location = /robots.txt` HERE, AND THE FOLDER DELETED IT ----------------
    #
    # A crawler reads robots.txt at the ORIGIN ROOT and nowhere else. Once this surface is `/trade`
    # on the apex, `/trade/robots.txt` is a file nothing fetches on any host. The rules have not
    # been relocated, they have STOPPED BEING THIS BUNDLE'S TO MAKE: `micro-site` owns
    # `/robots.txt` on this origin and its copy decides whether this surface is indexed.
    #
    # Deleted rather than left unreachable — an unreachable config file is not a safety net, it is
    # a thing a future reader finds, believes, and reasons from.
    #
    # The `Sitemap:` line it emitted now lives in micro-site's robots.txt, pointing at
    # `/trade/sitemap.xml` above.

    # ---- everything else -------------------------------------------------
    # A real file (favicon, the og card) is served; anything else 404s, and the error page below
    # turns that 404 into the app shell WITHOUT changing the status.
    #
    # There is no `public/robots.txt` to be shadowed by the exact-match location above, and there
    # must never be one: `location = /robots.txt` wins over this prefix, so a static file would be
    # in the repository, deployed, and unreachable — the worst of the three states, because the
    # next reader edits it and nothing happens.
    location / {
        try_files $uri =404;
    }

    error_page 404 /trade/index.html;

    # nginx's own health, for the container probe. It answers before the app has been fetched, so
    # it says the server is up — never that the product works. That is Beacon's job.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
