<!doctype html>
<!--
  data-cf-product picks the accent ramp and data-cf-substrate the ash ramp, both from
  @cloudsforge/ui/tokens.css. They are on <html> and set STATICALLY here rather than by React,
  because a page that paints before the attributes land flashes the default ember and then changes
  colour.

  'trade' is quench teal, #2a9e93 — its own block in tokens.css
  (`ui/packages/ui/src/tokens.css`), and the accent the registry gives this surface
  (`ui/packages/ui/src/surfaces.ts`). Checked rather than assumed: `admin` was set against
  a selector that did not exist, and the console wore the company's colour by accident for as long
  as that was true.

  'warm' is the ash ramp the brand marks in brand/assets/trade/ are drawn on, and the one every
  other product frontend in the estate uses.

  data-cf-scheme is the third of the three, added with @cloudsforge/ui 1.1. `auto` follows the
  reader's operating system; `light` and `dark` force one. It is set here, statically, for exactly
  the reason the other two are — an attribute that lands after the first paint is a colour change
  the reader watches happen, and a theme flash is worse than a theme nobody asked for.

  This surface never carried a light mode of its own, so there is nothing here to delete: the light
  scheme arrives entirely from the design system, where the contrast of every pair is measured on
  both schemes rather than on the one this repository happened to check.
-->
<html lang="en-GB" data-cf-product="trade" data-cf-substrate="warm" data-cf-scheme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      `color-scheme`, spelled the way the standard spells it, and declaring BOTH.

      This file used to say `colour-scheme`, which is not a metadata name any browser knows: it was
      inert, and the page got the user-agent default rather than the dark one it asked for. The
      value is `dark light` rather than `dark` because the token layer now switches both — this tag
      tells the browser which form controls and scrollbars to draw, `data-cf-scheme` on <html> tells
      @cloudsforge/ui which palette to resolve, and declaring only `dark` would leave a reader in a
      light environment fighting the page rather than being served by it.
    -->
    <meta name="color-scheme" content="dark light" />
    <!--
      The build that produced this bundle. Stamped by the Dockerfile, read by src/lib/obs.ts, and
      the reason an error report can be pinned to the deploy that introduced it. It is an identity
      rather than a configuration: it names the artefact, it does not tell it where it is running.
    -->
    <meta name="cf-release" content="dev" />

    <!--
      THE GOOGLE ANALYTICS MEASUREMENT ID, AND NOT THE GOOGLE ANALYTICS TAG.
      ────────────────────────────────────────────────────────────────────────────────────────
      There is deliberately no loader script for Google's tag anywhere in this file, and there must
      never be one. (Its host and its global function are not written out here either, so that a
      grep for either over this file answers zero — the same countermeasure the no-build-time-config
      test uses on itself.) The stock snippet fetches a third-party script and sets `_ga` on
      load — before any banner has been drawn, let alone answered — and under ePrivacy Art. 5(3) an
      analytics cookie set before consent is a violation that a banner underneath it does not cure.
      `@cloudsforge/ui/consent` injects the tag from exactly one place: the Accept button. See the
      header of that module for the whole argument. This estate is separately under GDPR review and
      custodies other people's money, which makes "tidy the analytics later" the wrong order.

      It is a meta tag rather than a build-time constant because
      test/no-build-time-config.test.ts greps for those and fails the build — an artefact with an
      environment frozen into it is not the artefact that passed CI. (That test greps this file
      too, which is why the prefix is not spelled out here.) It is the same mechanism `cf-release`
      above already uses, and the ID is an identity rather than a configuration: it names the
      property, it does not tell the bundle where it is running. An absent or empty value means
      analytics is simply off, which is what a local `pnpm dev` gets.
    -->
    <meta name="cf-analytics" content="G-ZFBLKK519K" />

    <!--
      The description says what the product is AND what it is not, in the same sentence, because
      this string is the one that ends up in a search result. Forge Trade is not an exchange: it
      has no order book and it makes no market.
    -->
    <meta
      name="description"
      content="Backtest a strategy against real bars, then run it as a paper or live bot. Fees and slippage are charged, because a strategy that only works for free does not work. Not an exchange."
    />

    <!--
      Brand chrome for the `trade` surface, from micro-brand's assets/trade/ set, copied
      byte-identical — test/brand-chrome.test.ts compares the bytes in both directions.

      This surface DOES ship an og card. brand/assets/trade/ holds one (og-1200x630.png) and Forge
      Trade is a public product whose catalogue is a page people link to. 18-build-status.md §3.3k
      drew the opposite conclusion only for the operator console, which nobody shares outward.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192x192.png" />

    <!--
      ONE og block, not two. foresight-web/index.html declares og:type, og:title and og:description
      twice — the second set silently wins in every crawler and the first is dead text nobody
      edits. Reported there; not repeated here, and test/brand-chrome.test.ts counts each property.

      The image is a RELATIVE path so the card resolves against whichever origin served the page,
      which is the same rule the rest of this bundle follows for hosts.

      The description carries no number. A card that said "beat the market" or quoted a return
      would be this bundle making a promise in the one place nobody reads the surrounding page.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Forge Trade" />
    <meta
      property="og:description"
      content="Test the idea before you fund it. Backtests and bots, charged the fee and slippage a real fill would cost. Results are modelled, not promised."
    />
    <!--
      ── THE MOUNT IS IN THESE BY HAND, AND IT HAS TO BE ────────────────────────────────────────
      vite rewrites `src` and `href` against `base` and does NOT touch `content`. So a
      root-relative `content="/og-1200x630.png"` survived the build unchanged, and on the apex that
      address belongs to MICRO-SITE — every shared link to this surface has been rendering the
      company's card instead of the product's since this surface moved to `/trade`. Silent, and
      only ever visible in someone else's chat client.

      `mountAsset()` in @cloudsforge/ui does the same composition at runtime for the head this app
      applies; this is the copy a link-preview fetcher reads, and those generally do not execute
      JavaScript — so it is the copy that decides what the card looks like.
    -->
    <meta property="og:image" content="/trade/og-1200x630.png" />

    <title>Forge Trade</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
